name: 视频跟踪

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 配置 bgutil PO Token Provider（脚本模式）
        run: |
          git clone --single-branch --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git "$HOME/bgutil-ytdlp-pot-provider"
          cd "$HOME/bgutil-ytdlp-pot-provider/server"
          npm ci
          npx tsc

      - name: 运行主流程（探测→转录→Email→通知）
        env:
          CHANNELS: ${{ secrets.CHANNELS }}
          COOKIES: ${{ secrets.COOKIES }}
          YTDLP_JS_RUNTIMES: node
          YTDLP_EXTRACTOR_ARGS: "youtube:player_client=mweb"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python scripts/track.py

      - name: 提交更新（去重记录/转录文本/元数据/report）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ archive.txt report.json
          git diff --staged --quiet || (
            git commit -m "chore: 更新跟踪数据 $(date +'%Y-%m-%d %H:%M') [skip ci]" &&
            git push
          )